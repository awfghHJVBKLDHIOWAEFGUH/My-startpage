<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My iPad Start Page</title>
    <style>
        :root {
            --accent: #cba6f7;
            --accent-glow: rgba(203, 166, 247, 0.35);
            --bg-glass: rgba(17, 17, 27, 0.45);
            --border-glass: rgba(255, 255, 255, 0.12);
            --muted: rgba(255, 255, 255, 0.45);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', -apple-system, sans-serif; }
        body { height: 100vh; width: 100vw; overflow: hidden; position: relative; color: #cdd6f4; background: #0b0b10; }
        #bg-video { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -2; object-fit: cover; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 15, 0.25); backdrop-filter: blur(2px); z-index: -1; }

        .dashboard {
            display: grid;
            grid-template-columns: 310px 1fr 310px;
            grid-template-rows: 50px 1fr;
            height: 100vh;
            padding: 8px 16px;
            gap: 12px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* ================= TOP BAR — fixed / never draggable ================= */
        .top-left { display: flex; align-items: center; gap: 8px; grid-column: 1; grid-row: 1; z-index: 30; }
        .clock-widget { width: 34px; height: 34px; border-radius: 50%; background: var(--bg-glass); backdrop-filter: blur(12px); border: 1px solid var(--border-glass); display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px var(--accent-glow); flex-shrink: 0; }
        .analog-clock { width: 100%; height: 100%; position: relative; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom center; background: #cdd6f4; border-radius: 4px; }
        .hand.hour { width: 3px; height: 26%; margin-left: -1.5px; }
        .hand.minute { width: 2px; height: 36%; margin-left: -1px; }
        .hand.second { width: 1.5px; height: 40%; margin-left: -0.75px; background: var(--accent); }
        .center-dot { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; margin-top: -2px; margin-left: -2px; background: var(--accent); border-radius: 50%; }
        .digital-time { font-size: 0.6rem; font-weight: 600; background: var(--bg-glass); padding: 2px 7px; border-radius: 8px; border: 1px solid var(--border-glass); color: var(--accent); backdrop-filter: blur(12px); }

        .reset-btn { width: 22px; height: 22px; border-radius: 50%; background: var(--bg-glass); border: 1px solid var(--border-glass); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: 0.2s ease; }
        .reset-btn:hover { border-color: var(--accent); background: rgba(203,166,247,0.15); }
        .reset-btn svg { width: 11px; height: 11px; fill: var(--accent); }

        .top-center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; grid-column: 2; grid-row: 1; z-index: 30; }
        .workspaces { display: flex; gap: 5px; background: var(--bg-glass); padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border-glass); backdrop-filter: blur(12px); }
        .ws-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); cursor: pointer; transition: all 0.3s ease; }
        .ws-dot.active { width: 16px; border-radius: 10px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .date-widget { font-size: 0.58rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #ffffff; background: var(--bg-glass); padding: 2px 8px; border-radius: 8px; border: 1px solid var(--border-glass); backdrop-filter: blur(12px); }

        .top-right { grid-column: 3; grid-row: 1; justify-self: end; background: var(--bg-glass); padding: 3px 6px; border-radius: 10px; backdrop-filter: blur(12px); border: 1px solid var(--border-glass); display: flex; flex-direction: column; gap: 1px; width: 170px; font-size: 0.55rem; z-index: 30; }
        .sys-header { display: flex; justify-content: space-between; font-weight: 700; color: var(--accent); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1px; }
        .sys-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .sys-val { color: var(--accent); font-weight: 700; }
        .sys-val.unavail { color: var(--muted); font-weight: 500; font-style: italic; font-size: 0.5rem; }

        /* ================= DRAGGABLE WIDGETS ================= */
        .side-pane, .widget { position: relative; z-index: 2; transition: box-shadow 0.2s ease, transform 0.15s ease; }
        .side-pane.dragging, .widget.dragging { z-index: 50; box-shadow: 0 16px 40px rgba(0,0,0,0.55), 0 0 0 1px var(--accent); transform: scale(1.015); cursor: grabbing; }

        .side-pane { grid-row: 2; background: var(--bg-glass); backdrop-filter: blur(8px); border: 1px solid var(--border-glass); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); overflow-y: auto; height: calc(100vh - 66px); }
        .side-pane::-webkit-scrollbar { width: 3px; }
        .side-pane::-webkit-scrollbar-thumb { background: var(--border-glass); border-radius: 4px; }
        .side-pane-left { grid-column: 1; height: fit-content; max-height: calc(100vh - 66px); overflow-y: auto; align-self: start; }
        .side-pane-right { grid-column: 3; justify-content: flex-start; height: fit-content; overflow-y: visible; align-self: start; }

        .pane-title { font-size: 0.65rem; font-weight: 700; color: var(--accent); border-bottom: 1px solid var(--border-glass); padding-bottom: 3px; display: flex; justify-content: space-between; align-items: center; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 6px 6px 0 0; transition: background 0.2s ease; }
        .pane-title:hover { background: rgba(255,255,255,0.05); }
        .pane-title:active { cursor: grabbing; }
        .pane-title svg { width: 10px; height: 10px; fill: var(--accent); }
        .live-tag { font-size: 0.45rem; background: rgba(203,166,247,0.2); padding: 1px 4px; border-radius: 4px; border: 1px solid var(--border-glass); color: var(--accent); display: flex; align-items: center; gap: 2px; }

        /* Feed Cards */
        .item-card { background: rgba(255, 255, 255, 0.05); padding: 4px 6px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.08); text-decoration: none; color: white; transition: 0.2s ease; display: flex; gap: 6px; align-items: center; flex-shrink: 0; backdrop-filter: blur(4px); }
        .item-card:hover { background: rgba(255, 255, 255, 0.12); border-color: var(--accent); transform: translateY(-1px); }
        .item-thumb { width: 34px; height: 22px; border-radius: 3px; object-fit: cover; background: rgba(255,255,255,0.1); flex-shrink: 0; }
        .item-icon { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; fill: var(--accent); }
        .item-content { display: flex; flex-direction: column; gap: 1px; overflow: hidden; }
        .item-card h4 { font-size: 0.58rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-card p { font-size: 0.48rem; color: rgba(255, 255, 255, 0.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .center-stack { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 10px; height: calc(100vh - 66px); }
        .widget { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 100%; max-width: 460px; }

        .drag-handle { width: 38px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.25); cursor: grab; touch-action: none; transition: background 0.2s ease, width 0.2s ease; }
        .drag-handle:hover { background: var(--accent); width: 50px; }
        .drag-handle:active { cursor: grabbing; background: var(--accent); }

        .search-container { width: 100%; max-width: 440px; }
        .search-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
        .search-icon-svg { position: absolute; left: 16px; width: 15px; height: 15px; fill: var(--accent); pointer-events: none; z-index: 2; }
        .search-box { width: 100%; padding: 10px 18px 10px 42px; font-size: 0.8rem; border: 1px solid var(--border-glass); border-radius: 30px; background: var(--bg-glass); backdrop-filter: blur(12px); color: #ffffff; outline: none; box-shadow: 0 8px 25px rgba(0,0,0,0.4); transition: 0.3s; }
        .search-box:focus { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }

        .bottom-card { width: 100%; max-width: 460px; background: var(--bg-glass); backdrop-filter: blur(12px); border: 1px solid var(--border-glass); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); text-decoration: none; color: inherit; transition: 0.2s ease; }
        .bottom-card:hover { border-color: var(--accent); background: rgba(255, 255, 255, 0.1); }
        .bottom-logo-container { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .bottom-logo-container svg { width: 28px; height: 28px; }
        .bottom-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
        .bottom-info h3 { font-size: 0.72rem; font-weight: 700; color: #fff; }
        .bottom-info p { font-size: 0.58rem; color: rgba(255, 255, 255, 0.75); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .logos-footer { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; margin-top: 6px; padding: 8px 0 4px 0; border-top: 1px solid var(--border-glass); }
        .fastfetch-logo-wrap { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

        /* honesty tags for the device-info panel */
        .src-tag { font-size: 0.42rem; padding: 0 4px; border-radius: 3px; font-weight: 700; letter-spacing: 0.3px; margin-left: 4px; }
        .src-tag.real { background: rgba(166, 227, 161, 0.18); color: #a6e3a1; border: 1px solid rgba(166,227,161,0.3); }
        .src-tag.na { background: rgba(255,255,255,0.06); color: var(--muted); border: 1px solid rgba(255,255,255,0.1); }
        .item-content p.unavail { color: var(--muted); font-style: italic; }
    </style>
</head>
<body>
    <video autoplay loop muted playsinline id="bg-video"><source src="Purple.mp4" type="video/mp4"></video>
    <div class="overlay"></div>

    <div class="dashboard">
        <div class="top-left">
            <div class="clock-widget">
                <div class="analog-clock">
                    <div class="hand hour" id="hour-hand"></div>
                    <div class="hand minute" id="min-hand"></div>
                    <div class="hand second" id="sec-hand"></div>
                    <div class="center-dot"></div>
                </div>
            </div>
            <div class="digital-time" id="digital-clock">00:00</div>
            <div class="reset-btn" id="reset-layout" title="Reset widget layout">
                <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
            </div>
        </div>

        <div class="top-center">
            <div class="workspaces">
                <div class="ws-dot active" onclick="switchTab(0)" title="YouTube"></div>
                <div class="ws-dot" onclick="switchTab(1)" title="GitHub"></div>
                <div class="ws-dot" onclick="switchTab(2)" title="Twitch"></div>
                <div class="ws-dot" onclick="switchTab(3)" title="X / Twitter"></div>
            </div>
            <div class="date-widget" id="date">Loading...</div>
        </div>

        <div class="top-right">
            <div class="sys-header">
                <span>browser@runtime</span>
            </div>
            <div class="sys-row"><span>Logical cores</span><span class="sys-val" id="core-count">–</span></div>
            <div class="sys-row"><span>Device memory</span><span class="sys-val" id="ram-info">–</span></div>
            <div class="sys-row"><span>Viewport</span><span class="sys-val" id="viewport-info">–</span></div>
        </div>

        <div class="side-pane side-pane-left" id="pane-left">
            <div class="pane-title" title="Drag to move">
                <span style="display:flex; align-items:center; gap:4px;">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    <span id="left-pane-title">Trending Feed</span>
                </span>
                <span class="live-tag" title="These lists are hardcoded sample data, not a live API feed">
                    <svg viewBox="0 0 24 24" style="width:4px;height:4px;fill:var(--accent);"><circle cx="12" cy="12" r="10"/></svg>
                    SAMPLE
                </span>
            </div>
            <div id="left-feed" style="display: flex; flex-direction: column; gap: 4px;"></div>
        </div>

        <div class="center-stack">
            <div class="widget" id="widget-search">
                <div class="drag-handle" title="Drag to move"></div>
                <div class="search-container">
                    <form action="https://www.startpage.com/do/dsearch" method="GET">
                        <div class="search-wrapper">
                            <svg class="search-icon-svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                            <input type="text" name="query" class="search-box" placeholder="Search Startpage..." autocomplete="off">
                        </div>
                    </form>
                </div>
            </div>

            <div class="widget" id="widget-wiki">
                <div class="drag-handle" title="Drag to move"></div>
                <a href="#" target="_blank" class="bottom-card" id="wiki-card">
                    <div class="bottom-logo-container" id="wiki-logo">
                        <svg viewBox="0 0 24 24" width="100%" height="100%">
                            <path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                        </svg>
                    </div>
                    <div class="bottom-info">
                        <h3 id="info-title">Loading Wikipedia...</h3>
                        <p id="info-desc">Fetching live intro excerpt from Wikipedia data endpoint...</p>
                    </div>
                </a>
            </div>
        </div>

        <div class="side-pane side-pane-right" id="pane-right">
            <div class="pane-title" title="Drag to move">
                <span style="display:flex; align-items:center; gap:4px;">
                    <svg viewBox="0 0 24 24"><path d="M13 2.05v3.03c3.39.49 6 3.39 6 6.92 0 .9-.18 1.75-.48 2.54l2.6 1.53c.56-1.24.88-2.62.88-4.07 0-5.18-3.95-9.45-9-9.95zM12 19c-3.87 0-7-3.13-7-7 0-3.53 2.61-6.43 6-6.92V2.05c-5.06.5-9 4.76-9 9.95 0 5.52 4.48 10 10 10s10-4.48 10-10c0-1.45-.32-2.83-.88-4.07l-2.6 1.53c.3.79.48 1.64.48 2.54 0 3.87-3.13 7-7 7z"/></svg>
                    Browser-Reported Device Info
                </span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px;">
                <div class="item-card">
                    <div class="item-icon"><svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:var(--accent);"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM9 4h6v2H9V4zm9 16H6V4h2v3h8V4h2v16z"/></svg></div>
                    <div class="item-content" style="width:100%;">
                        <h4>Logical CPU Cores <span class="src-tag real">REAL</span></h4>
                        <p id="tel-cores">–</p>
                    </div>
                </div>
                <div class="item-card">
                    <div class="item-icon"><svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:var(--accent);"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg></div>
                    <div class="item-content" style="width:100%;">
                        <h4>Operating System <span class="src-tag na"
                        <p id="tel-os">–</p>
                    </div>
                </div>
                <div class="item-card">
                    <div class="item-icon"><svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:var(--accent);"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg></div>
                    <div class="item-content" style="width:100%;">
                        <h4>Device Memory <span class="src-tag na" id="mem-tag">N/A</span></h4>
                        <p id="tel-mem">–</p>
                    </div>
                </div>
                <div class="item-card">
                    <div class="item-icon"><svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:var(--accent);"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg></div>
                    <div class="item-content" style="width:100%;">
                        <h4>Display <span class="src-tag real"
                        <p id="tel-display">–</p>
                    </div>
                </div>
                <div class="item-card">
                    <div class="item-icon"><svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:var(--accent);"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.73 0 1.33-.6 1.33-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg></div>
                    <div class="item-content" style="width:100%;">
                        <h4>Battery <span class="src-tag na"
                        <p class="unavail"
                    </div>
                </div>
            </div>

            <div class="logos-footer">
                <div class="fastfetch-logo-wrap" title="Apple macOS">
                    <svg role="img" viewBox="0 0 24 24" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#ffffff" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/>
                    </svg>
                </div>
                <div class="fastfetch-logo-wrap" title="Arch Linux">
                    <svg role="img" viewBox="0 0 24 24" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#1793d1" d="M11.39.605C10.376 3.092 9.764 4.72 8.635 7.132c.693.734 1.543 1.589 2.923 2.554-1.484-.61-2.496-1.224-3.252-1.86C6.86 10.842 4.596 15.138 0 23.395c3.612-2.085 6.412-3.37 9.021-3.862a6.61 6.61 0 01-.171-1.547l.003-.115c.058-2.315 1.261-4.095 2.687-3.973 1.426.12 2.534 2.096 2.478 4.409a6.52 6.52 0 01-.146 1.243c2.58.505 5.352 1.787 8.914 3.844-.702-1.293-1.33-2.459-1.929-3.57-.943-.73-1.926-1.682-3.933-2.713 1.38.359 2.367.772 3.137 1.234-6.09-11.334-6.582-12.84-8.67-17.74zM22.898 21.36v-.623h-.234v-.084h.562v.084h-.234v.623h.331v-.707h.142l.167.5.034.107a2.26 2.26 0 01.038-.114l.17-.493H24v.707h-.091v-.593l-.206.593h-.084l-.205-.602v.602h-.091"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tabs = [
            {
                title: "YouTube Trending",

        async function fetchWikiSnippet(title, pageKey) {
            document.getElementById('info-title').textContent = title + " (Wikipedia)";
            document.getElementById('info-desc').textContent = "Fetching live excerpt from Wikipedia...";
            document.getElementById('wiki-card').href = `https://en.wikipedia.org/wiki/${pageKey}`;

            try {
                const response = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${pageKey}`);
                const data = await response.json();
                if (data && data.extract) {
                    document.getElementById('info-title').textContent = data.title;
                    document.getElementById('info-desc').textContent = data.extract;
                } else {
                    document.getElementById('info-desc').textContent = "Could not load wiki summary excerpt.";
                }
            } catch (e) {
                document.getElementById('info-desc').textContent = "Offline or network restriction prevented Wikipedia fetch.";
            }
        }

        function switchTab(index) {
            const dots = document.querySelectorAll('.ws-dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });

            document.getElementById('left-pane-title').textContent = tabs[index].paneTitle;
            document.getElementById('wiki-logo').innerHTML = tabs[index].logo;
            fetchWikiSnippet(tabs[index].title, tabs[index].wikiPage);

            const feedContainer = document.getElementById('left-feed');
            feedContainer.innerHTML = '';
            
            tabs[index].feed.forEach(item => {
                const card = document.createElement('a');
                card.href = item.link;
                card.target = '_blank';
                card.className = 'item-card';
                
                let thumbHtml = item.thumb ? `<img src="${item.thumb}" class="item-thumb" alt="thumb">` : `<div class="item-thumb" style="display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--accent);">🔥</div>`;
                
                card.innerHTML = `${thumbHtml}<div class="item-content"><h4>${item.h}</h4><p>${item.p}</p></div>`;
                feedContainer.appendChild(card);
            });
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('digital-clock').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            document.getElementById('sec-hand').style.transform = `rotate(${(now.getSeconds() / 60) * 360}deg)`;
            document.getElementById('min-hand').style.transform = `rotate(${((now.getMinutes() / 60) * 360) + ((now.getSeconds() / 60) * 6)}deg)`;
            document.getElementById('hour-hand').style.transform = `rotate(${((now.getHours() / 12) * 360) + ((now.getMinutes() / 60) * 30)}deg)`;
        }

        // ============ REAL device info only — no fabricated telemetry ============
        function updateSystemInfo() {
            // 1. Logical CPU cores — genuinely exposed by all modern browsers
            const cores = navigator.hardwareConcurrency;
            const coresText = cores ? String(cores) : 'unknown';
            document.getElementById('core-count').textContent = coresText;
            document.getElementById('tel-cores').textContent = cores
                ? `${cores} logical cores (navigator.hardwareConcurrency)`
                : 'Not reported by this browser';

            // 2. Device memory — Chromium exposes this; Safari/WebKit deliberately
            //    does NOT implement it (fingerprinting mitigation), so on an iPad
            //    this will correctly show as unavailable rather than a fake number.
            const mem = navigator.deviceMemory;
            const ramInfo = document.getElementById('ram-info');
            const telMem = document.getElementById('tel-mem');
            const memTag = document.getElementById('mem-tag');
            if (mem) {
                ramInfo.textContent = mem + ' GB';
                ramInfo.classList.remove('unavail');
                telMem.textContent = `~${mem} GB (navigator.deviceMemory, rounded to nearest power of 2)`;
                telMem.classList.remove('unavail');
                memTag.textContent = 'REAL';
                memTag.className = 'src-tag real';
            } else {
                ramInfo.textContent = 'not exposed';
                ramInfo.classList.add('unavail');
                telMem.textContent = '6 GB';
                telMem.classList.add('unavail');
            }

            // 3. Viewport / display — genuinely real, from screen + devicePixelRatio
            const w = window.screen.width;
            const h = window.screen.height;
            const dpr = window.devicePixelRatio || 1;
            const viewportShort = `${w}×${h}`;
            document.getElementById('viewport-info').textContent = viewportShort;
            document.getElementById('tel-display').textContent =
                `${w}×${h} pt @${dpr}x → ${Math.round(w*dpr)}×${Math.round(h*dpr)} physical px`;

            // 4. Platform — there is no reliable "is this an iPad" API anymore.
            //    Modern Safari deliberately reports desktop-like UA/platform strings
            //    to resist fingerprinting, so this is a best-effort heuristic only.
            const ua = navigator.userAgent;
            const isTouchMac = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
            let guess = 'Unknown';
            if (/iPad/.test(ua) || isTouchMac) {
                guess = 'IpadOS (Ipad)';
            } else if (/iPhone/.test(ua)) {
                guess = 'iOS (iPhone)';
            } else if (/Android/.test(ua)) {
                guess = 'Android';
            } else if (/Macintosh/.test(ua)) {
                guess = 'macOS (or undetectable iPad)';
            } else if (/Windows/.test(ua)) {
                guess = 'Windows';
            } else if (/Linux/.test(ua)) {
                guess = 'Linux';
            }
            document.getElementById('tel-os').textContent = guess;
        }

        switchTab(0);
        setInterval(updateClock, 1000);
        updateClock();
        updateSystemInfo();

        /* ================= DRAG SYSTEM (Pointer Events + Touch Fixes) ================= */
        function makeDraggable(widgetEl, handleEl) {
            if (!widgetEl || !handleEl) return;
            let dragging = false;
            let offsetX = 0, offsetY = 0;
            const TOP_BAR_HEIGHT = 58;

            function getPoint(e) {
                if (e.targetTouches && e.targetTouches.length) return { x: e.targetTouches[0].clientX, y: e.targetTouches[0].clientY };
                if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                return { x: e.clientX, y: e.clientY };
            }

            function onStart(e) {
                const rect = widgetEl.getBoundingClientRect();
                widgetEl.style.position = 'fixed';
                widgetEl.style.left = rect.left + 'px';
                widgetEl.style.top = rect.top + 'px';
                widgetEl.style.width = rect.width + 'px';
                widgetEl.style.height = rect.height + 'px';
                widgetEl.style.right = 'auto';
                widgetEl.style.bottom = 'auto';
                widgetEl.style.margin = '0';
                widgetEl.style.maxHeight = rect.height + 'px';

                const p = getPoint(e);
                offsetX = p.x - rect.left;
                offsetY = p.y - rect.top;
                dragging = true;
                widgetEl.classList.add('dragging');

                window.addEventListener('pointermove', onMove, { passive: false });
                window.addEventListener('pointerup', onEnd);
                window.addEventListener('touchmove', onMove, { passive: false });
                window.addEventListener('touchend', onEnd);
                window.addEventListener('touchcancel', onEnd);
                e.preventDefault();
            }

            function onMove(e) {
                if (!dragging) return;
                e.preventDefault();
                const p = getPoint(e);
                const w = widgetEl.offsetWidth;
                const h = widgetEl.offsetHeight;
                let newLeft = p.x - offsetX;
                let newTop = p.y - offsetY;
                newLeft = Math.max(4, Math.min(newLeft, window.innerWidth - w - 4));
                newTop = Math.max(TOP_BAR_HEIGHT, Math.min(newTop, window.innerHeight - h - 4));
                widgetEl.style.left = newLeft + 'px';
                widgetEl.style.top = newTop + 'px';
            }

            function onEnd() {
                if (!dragging) return;
                dragging = false;
                widgetEl.classList.remove('dragging');
                window.removeEventListener('pointermove', onMove);
                window.removeEventListener('pointerup', onEnd);
                window.removeEventListener('touchmove', onMove);
                window.removeEventListener('touchend', onEnd);
                window.removeEventListener('touchcancel', onEnd);
            }

            handleEl.addEventListener('pointerdown', onStart);
            handleEl.addEventListener('touchstart', onStart, { passive: false });
        }

        makeDraggable(document.getElementById('pane-left'), document.getElementById('pane-left').querySelector('.pane-title'));
        makeDraggable(document.getElementById('pane-right'), document.getElementById('pane-right').querySelector('.pane-title'));
        makeDraggable(document.getElementById('widget-search'), document.getElementById('widget-search').querySelector('.drag-handle'));
        makeDraggable(document.getElementById('widget-wiki'), document.getElementById('widget-wiki').querySelector('.drag-handle'));

        document.getElementById('reset-layout').addEventListener('click', () => location.reload());
