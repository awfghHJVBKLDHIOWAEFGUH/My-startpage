<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Start Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        /* Background Video */
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -2;
            object-fit: cover;
        }

        /* Dark Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(2px);
            z-index: -1;
        }

        /* Container */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 90%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* Date Subtitle */
        .date-display {
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* Clock Styling */
        .clock {
            font-size: 5.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            text-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            line-height: 1;
        }

        /* Search Form & Bar */
        .search-form {
            width: 100%;
            margin-top: 10px;
        }

        .search-box {
            width: 100%;
            padding: 18px 28px;
            font-size: 1.15rem;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: #ffffff;
            outline: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .search-box:focus {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(255, 255, 255, 0.2);
        }

        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }

        /* Bookmark Cards Grid */
        .bookmarks {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .bookmark-card {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 55px;
            height: 55px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            font-size: 1.3rem;
            transition: transform 0.2s ease, background 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .bookmark-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <!-- Background Video -->
    <video autoplay loop muted playsinline id="bg-video">
        <source src="Purple.mp4" type="video/mp4">
    </video>

    <!-- Dark Overlay -->
    <div class="overlay"></div>

    <!-- Main Content Container -->
    <div class="container">
        <div class="date-display" id="date">Loading...</div>
        <div class="clock" id="clock">00:00</div>
        
        <form class="search-form" action="https://www.google.com/search" method="GET">
            <input type="text" name="q" class="search-box" placeholder="Search the web..." aria-label="Search the web" autofocus autocomplete="off">
        </form>

        <!-- Quick Links Grid -->
        <div class="bookmarks">
            <a href="https://youtube.com" class="bookmark-card" target="_blank" rel="noopener noreferrer" aria-label="YouTube">▶</a>
            <a href="https://reddit.com" class="bookmark-card" target="_blank" rel="noopener noreferrer" aria-label="Reddit">💬</a>
            <a href="https://github.com" class="bookmark-card" target="_blank" rel="noopener noreferrer" aria-label="GitHub">🐙</a>
            <a href="https://x.com" class="bookmark-card" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">⚡</a>
        </div>
    </div>

    <!-- Live Date & Clock Script -->
    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;

            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
        }
        setInterval(updateClock, 30000);
        updateClock();
    </script>
</body>
</html>
